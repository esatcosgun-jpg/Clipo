<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
getDoc,
setDoc,
updateDoc,
increment,
query,
orderBy,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
apiKey:"AIzaSyDys5NqKqRt2GFcDBUnE1PGXXOC3ap8Asw",
authDomain:"cripo-e7483.firebaseapp.com",
projectId:"cripo-e7483",
storageBucket:"cripo-e7483.firebasestorage.app",
messagingSenderId:"687926578600",
appId:"1:687926578600:web:a1bc8b8740d9d153a4e19d",
measurementId:"G-M4BYQYDYYX"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const POSTS=collection(db,"paylasimlar");
const USERS=collection(db,"kullanicilar");

let currentUser=null;
let profilePhotoData="";
let selectedPostImage="";
let postsCache=[];


/* MODAL */

function openModal(id){
const el=document.getElementById(id);
if(el) el.classList.add("show");
}

function closeModal(id){
const el=document.getElementById(id);
if(el) el.classList.remove("show");
}

document.querySelectorAll("[data-close]").forEach(function(btn){
btn.addEventListener("click",function(){
closeModal(btn.dataset.close);
});
});


/* GİRİŞ */

function openLogin(){
openModal("loginModal");
}

window.openLogin=openLogin;

document.getElementById("loginButton").addEventListener("click",function(){
if(currentUser) openProfile();
else openLogin();
});

document.getElementById("loginSubmit").addEventListener("click",loginUser);
document.getElementById("registerSubmit").addEventListener("click",registerUser);

async function loginUser(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;
const msg=document.getElementById("loginMessage");

if(!email||!password){
msg.innerText="E-posta ve şifreyi gir.";
return;
}

msg.innerText="Giriş yapılıyor...";

try{

await signInWithEmailAndPassword(auth,email,password);

msg.innerText="✅ Giriş başarılı.";

setTimeout(function(){
closeModal("loginModal");
},500);

}catch(error){

console.error(error);
msg.innerText="❌ "+translateError(error.code);

}

}


/* KAYIT */

async function registerUser(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;
const msg=document.getElementById("loginMessage");

if(!email||!password){
msg.innerText="E-posta ve şifreyi gir.";
return;
}

if(password.length<6){
msg.innerText="Şifre en az 6 karakter olmalı.";
return;
}

msg.innerText="Hesap oluşturuluyor...";

try{

const result=await createUserWithEmailAndPassword(
auth,email,password
);

await setDoc(
doc(USERS,result.user.uid),
{
ePosta:email,
isim:email.split("@")[0],
resim:"",
olusturulmaTarihi:serverTimestamp()
}
);

msg.innerText="✅ Hesap oluşturuldu.";

setTimeout(function(){
closeModal("loginModal");
},700);

}catch(error){

console.error(error);
msg.innerText="❌ "+translateError(error.code);

}

}


function translateError(code){

const errors={
"auth/email-already-in-use":"Bu e-posta zaten kayıtlı.",
"auth/invalid-email":"E-posta adresi hatalı.",
"auth/weak-password":"Şifre çok zayıf.",
"auth/invalid-credential":"E-posta veya şifre yanlış.",
"auth/user-not-found":"Bu hesap bulunamadı.",
"auth/wrong-password":"Şifre yanlış.",
"auth/too-many-requests":"Çok fazla deneme yapıldı.",
"auth/network-request-failed":"İnternet bağlantısını kontrol et."
};

return errors[code]||"Firebase hatası: "+code;
}


/* AUTH DURUMU */

onAuthStateChanged(auth,async function(user){

currentUser=user;

const button=document.getElementById("loginButton");

if(user){

button.innerText="Profil";

await loadUserProfile();

}else{

button.innerText="Giriş Yap";

}

});


/* PROFİL */

function openProfile(){

if(!currentUser){
openLogin();
return;
}

loadUserProfile();
openModal("profileModal");

}

window.openProfile=openProfile;

document.getElementById("profileButton").addEventListener("click",openProfile);
document.getElementById("myStory").addEventListener("click",openProfile);

async function loadUserProfile(){

if(!currentUser)return;

document.getElementById("profileEmail").innerText=currentUser.email||"";

try{

const snap=await getDoc(doc(USERS,currentUser.uid));

if(snap.exists()){

const data=snap.data();

document.getElementById("profileName").innerText=
data.isim||currentUser.email.split("@")[0];

if(data.resim){

profilePhotoData=data.resim;

document.getElementById("profileAvatar").innerHTML=
"<img src='"+data.resim+"' alt='Profil'>";

}

}

}catch(error){
console.error(error);
}

}


/* RESİM SIKIŞTIR */

function compressImage(file){

return new Promise(function(resolve,reject){

const reader=new FileReader();

reader.onload=function(){

const img=new Image();

img.onload=function(){

const max=900;
let w=img.width;
let h=img.height;

if(w>max){
h=h*max/w;
w=max;
}

if(h>max){
w=w*max/h;
h=max;
}

const canvas=document.createElement("canvas");
canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,w,h);

resolve(canvas.toDataURL("image/jpeg",0.65));

};

img.onerror=reject;
img.src=reader.result;

};

reader.onerror=reject;
reader.readAsDataURL(file);

});
}


/* PROFİL FOTO */

document.getElementById("profileFile").addEventListener("change",async function(e){

const file=e.target.files[0];

if(!file)return;

try{

profilePhotoData=await compressImage(file);

document.getElementById("profileAvatar").innerHTML=
"<img src='"+profilePhotoData+"' alt='Profil'>";

}catch(error){

console.error(error);

}

});


document.getElementById("saveProfileButton").addEventListener("click",async function(){

if(!currentUser){
openLogin();
return;
}

const msg=document.getElementById("profileMessage");
msg.innerText="Kaydediliyor...";

try{

await setDoc(
doc(USERS,currentUser.uid),
{
ePosta:currentUser.email,
isim:document.getElementById("profileName").innerText,
resim:profilePhotoData,
guncelleme:serverTimestamp()
},
{merge:true}
);

msg.innerText="✅ Profil kaydedildi.";

}catch(error){

console.error(error);
msg.innerText="❌ Profil kaydedilemedi: "+error.code;

}

});


/* ÇIKIŞ */

document.getElementById("logoutButton").addEventListener("click",async function(){

await signOut(auth);
closeModal("profileModal");

});


/* PAYLAŞIM AÇ */

document.getElementById("addButton").addEventListener("click",function(){

if(!currentUser){
openLogin();
return;
}

document.getElementById("postCaption").value="";
document.getElementById("postImage").value="";
document.getElementById("postPreview").style.display="none";
selectedPostImage="";

openModal("createModal");

});


/* PAYLAŞIM FOTOĞRAFI */

document.getElementById("postImage").addEventListener("change",async function(e){

const file=e.target.files[0];

if(!file)return;

const msg=document.getElementById("postMessage");

msg.innerText="Fotoğraf hazırlanıyor...";

try{

selectedPostImage=await compressImage(file);

const preview=document.getElementById("postPreview");

preview.src=selectedPostImage;
preview.style.display="block";

msg.innerText="Fotoğraf hazır.";

}catch(error){

console.error(error);
msg.innerText="Fotoğraf okunamadı.";

}

});


/* PAYLAŞ */

document.getElementById("createPostButton").addEventListener("click",createPost);

async function createPost(){

if(!currentUser){
openLogin();
return;
}

const caption=document.getElementById("postCaption").value.trim();
const msg=document.getElementById("postMessage");

if(!caption&&!selectedPostImage){

msg.innerText="❌
