<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#050505;
    color:#fff;
}

button,
input,
textarea{
    font:inherit;
}

.app{
    max-width:500px;
    min-height:100vh;
    margin:auto;
    background:#0b0b0b;
    padding-bottom:90px;
}

.topbar{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#090909;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#ff1744;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.top-btn{
    border:0;
    background:#ff1744;
    color:#fff;
    padding:9px 13px;
    border-radius:20px;
    font-weight:bold;
}

.top-icon{
    font-size:22px;
    padding:5px;
    cursor:pointer;
}

.stories{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding:15px;
    border-bottom:1px solid #222;
}

.story{
    min-width:62px;
    text-align:center;
    font-size:11px;
    cursor:pointer;
}

.story-img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid #ff1744;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 5px;
    background:#181818;
    font-size:23px;
}

.post{
    background:#111;
    border-bottom:1px solid #252525;
    margin-bottom:18px;
}

.post-header{
    min-height:58px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 14px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

.media{
    width:100%;
    min-height:280px;
    max-height:600px;
    background:#181818;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.media img,
.media video{
    width:100%;
    max-height:600px;
    object-fit:contain;
}

.media-placeholder{
    font-size:75px;
}

.actions{
    display:flex;
    align-items:center;
    gap:20px;
    padding:12px 15px 5px;
}

.action{
    font-size:25px;
    cursor:pointer;
}

.like.active{
    color:#ff1744;
}

.likes{
    padding:5px 15px;
    font-weight:bold;
}

.caption{
    padding:5px 15px 12px;
    color:#ddd;
    line-height:1.4;
}

.comments{
    padding:0 15px 8px;
}

.comment{
    padding:5px 0;
    font-size:13px;
}

.comment-form{
    display:flex;
    gap:7px;
    padding:0 15px 14px;
}

.comment-form input{
    flex:1;
    min-width:0;
    background:#090909;
    color:#fff;
    border:1px solid #333;
    border-radius:9px;
    padding:10px;
    outline:none;
}

.comment-form button{
    border:0;
    border-radius:9px;
    background:#ff1744;
    color:#fff;
    padding:0 13px;
    font-weight:bold;
}

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:500px;
    height:70px;
    background:#090909;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:30;
}

.nav{
    text-align:center;
    color:#aaa;
    font-size:12px;
    cursor:pointer;
}

.nav-icon{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.add{
    width:52px;
    height:42px;
    border-radius:12px;
    background:#fff;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.93);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.show{
    display:flex;
}

.box{
    width:100%;
    max-width:390px;
    max-height:90vh;
    overflow:auto;
    background:#151515;
    border-radius:20px;
    padding:22px;
}

.close{
    text-align:right;
    font-size:28px;
    cursor:pointer;
}

.box h2{
    text-align:center;
    margin:8px 0 20px;
}

.input{
    width:100%;
    height:48px;
    margin-bottom:12px;
    padding:0 14px;
    background:#090909;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    outline:none;
}

textarea.input{
    height:90px;
    padding:12px 14px;
    resize:none;
}

.btn{
    width:100%;
    min-height:48px;
    border:0;
    border-radius:10px;
    background:#ff1744;
    color:#fff;
    font-weight:bold;
    margin-bottom:10px;
    cursor:pointer;
}

.btn.secondary{
    background:#333;
}

.btn.google{
    background:#fff;
    color:#111;
}

.message{
    text-align:center;
    color:#aaa;
    font-size:13px;
    line-height:1.5;
    margin-top:8px;
}

.profile-avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#333;
    margin:10px auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
}

.profile-email{
    text-align:center;
    color:#aaa;
    word-break:break-all;
    margin-bottom:20px;
}

.file-label{
    display:block;
    text-align:center;
    background:#333;
    padding:14px;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
}

.file-label input{
    display:none;
}

.preview{
    width:100%;
    max-height:250px;
    object-fit:contain;
    border-radius:10px;
    display:none;
    margin-bottom:10px;
}

.list{
    max-height:300px;
    overflow:auto;
    background:#090909;
    border-radius:10px;
}

.list-item{
    padding:13px;
    border-bottom:1px solid #333;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px;
}
</style>
</head>
