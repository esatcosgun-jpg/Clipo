<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
getDoc,
setDoc,
doc,
updateDoc,
increment,
query,
orderBy,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytesResumable,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


const firebaseConfig={

apiKey:
"AIzaSyDys5NqKqRt2GFcDBUnE1PGXXOC3ap8Asw",

authDomain:
"cripo-e7483.firebaseapp.com",

projectId:
"cripo-e7483",

storageBucket:
"cripo-e7483.firebasestorage.app",

messagingSenderId:
"687926578600",

appId:
"1:687926578600:web:a1bc8b8740d9d153a4e19d",

measurementId:
"G-M4BYQYDYYX"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const storage=getStorage(app);


const POSTS=collection(db,"paylasimlar");

const USERS=collection(db,"kullanicilar");

const COMMENTS=collection(db,"yorumlar");

const MESSAGES=collection(db,"mesajlar");


let currentUser=null;

let postsCache=[];

let selectedFile=null;

let profileFile=null;


/* =========================
   SAYFA
========================= */

window.addEventListener(
"load",
()=>{
loadPosts();
}
);


/* =========================
   AUTH
========================= */

onAuthStateChanged(
auth,
async user=>{

currentUser=user;

const btn=
document.getElementById("loginButton");

if(user){

btn.innerText="Profil";

btn.onclick=openProfile;

await loadUserProfile();

}else{

btn.innerText="Giriş Yap";

btn.onclick=openLogin;

}

}
);


/* =========================
   GİRİŞ
========================= */

window.openLogin=()=>{

document
.getElementById("loginModal")
.classList.add("show");

};


window.loginUser=async()=>{

const email=
document.getElementById("loginEmail")
.value.trim();

const password=
document.getElementById("loginPassword")
.value;

const msg=
document.getElementById("loginMessage");

if(!email||!password){

msg.innerText="E-posta ve şifreyi gir.";

return;

}

msg.innerText="Giriş yapılıyor...";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

msg.innerText="✅ Giriş başarılı.";

setTimeout(
()=>{
closeModal("loginModal");
},
500
);

}catch(error){

console.error(error);

msg.innerText=
"❌ "+translateError(error.code);

}

};


/* =========================
   KAYIT
========================= */

window.registerUser=async()=>{

const email=
document.getElementById("loginEmail")
.value.trim();

const password=
document.getElementById("loginPassword")
.value;

const msg=
document.getElementById("loginMessage");

if(!email||!password){

msg.innerText="E-posta ve şifreyi gir.";

return;

}

if(password.length<6){

msg.innerText=
"Şifre en az 6 karakter olmalı.";

return;

}

msg.innerText=
"Hesap oluşturuluyor...";

try{

const result=
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(USERS,result.user.uid),
{
ePosta:email,
isim:email.split("@")[0],
resim:"",
olusturulmaTarihi:serverTimestamp()
}
);

msg.innerText=
"🎉 Hesap oluşturuldu.";

setTimeout(
()=>{
closeModal("loginModal");
},
700
);

}catch(error){

console.error(error);

msg.innerText=
"❌ "+translateError(error.code);

}

};


function translateError(code){

const errors={

"auth/email-already-in-use":
"Bu e-posta zaten kayıtlı.",

"auth/invalid-email":
"E-posta adresi hatalı.",

"auth/weak-password":
"Şifre en az 6 karakter olmalı.",

"auth/invalid-credential":
"E-posta veya şifre yanlış.",

"auth/user-not-found":
"Hesap bulunamadı.",

"auth/wrong-password":
"Şifre yanlış.",

"auth/too-many-requests":
"Çok fazla deneme yapıldı. Biraz bekle.",

"auth/network-request-failed":
"İnternet bağlantısını kontrol et."

};

return errors[code]||code;

}


/* =========================
   PROFİL
========================= */

window.openProfileOrLogin=()=>{

if(currentUser)
openProfile();
else
openLogin();

};


window.openProfile=async()=>{

if(!currentUser){

openLogin();
return;

}

await loadUserProfile();

document
.getElementById("profileModal")
.classList.add("show");

};


async function loadUserProfile(){

if(!currentUser)return;

try{

const snap=
await getDoc(
doc(USERS,currentUser.uid)
);

document
.getElementById("profileEmail")
.innerText=
currentUser.email||"";

if(snap.exists()){

const data=snap.data();

document
.getElementById("profileName")
.innerText=
data.isim||
currentUser.email.split("@")[0];

if(data.resim){

document
.getElementById("profileAvatar")
.innerHTML=
"<img src='"+data.resim+"'>";

document
.getElementById("myStoryPhoto")
.innerHTML=
"<img src='"+data.resim+"'>";

}

}

}catch(error){

console.error(error);

}

}


/* =========================
   PROFİL FOTOĞRAFI
========================= */

window.changeProfilePhoto=event=>{

const file=event.target.files[0];

if(!file)return;

profileFile=file;

const url=
URL.createObjectURL(file);

document
.getElementById("profileAvatar")
.innerHTML=
"<img src='"+url+"'>";

};


window.saveProfile=async()=>{

if(!currentUser){

openLogin();
return;

}

const msg=
document.getElementById("profileMessage");

msg.innerText="Kaydediliyor...";

try{

let photoURL="";

if(profileFile){

photoURL=
await uploadFile(
profileFile,
"profil/"+currentUser.uid
);

}

const name=
document
.getElementById("profileName")
.innerText
.trim();

await setDoc(
doc(USERS,currentUser.uid),
{
ePosta:currentUser.email,
isim:name||currentUser.email.split("@")[0],
resim:photoURL,
guncellemeTarihi:serverTimestamp()
},
{merge:true}
);

profileFile=null;

msg.innerText=
"✅ Profil kaydedildi.";

await loadUserProfile();

}catch(error){

console.error(error);

msg.innerText=
"❌ Profil kaydedilemedi: "+error.message;

}

};


/* =========================
   DOSYA YÜKLEME
========================= */

function uploadFile(file,folder){

return new Promise(
(resolve,reject)=>{

const safeName=
Date.now()+"_"+file.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const storageRef=
ref(
storage,
folder+"/"+safeName
);

const task=
uploadBytesResumable(
storageRef,
file
);

task.on(
"state_changed",

snapshot=>{

const percent=
(snapshot.bytesTransferred/
snapshot.totalBytes)*100;

const bar=
document.getElementById("progressBar");

const progress=
document.getElementById("uploadProgress");

if(bar){

bar.style.width=
percent+"%";

progress.style.display=
"block";

}

},

error=>{
reject(error);
},

async()=>{
try{

const url=
await getDownloadURL(
task.snapshot.ref
);

resolve(url);

}catch(error){

reject(error);

}

}

);

}
);

}


/* =========================
   PAYLAŞIM DOSYASI
========================= */

window.previewPostFile=event=>{

selectedFile=
event.target.files[0];

if(!selectedFile)return;

const image=
document.getElementById(
"postImagePreview"
);

const video=
document.getElementById(
"postVideoPreview"
);

image.style.display="none";
video.style.display="none";

const url=
URL.createObjectURL(selectedFile);

if(selectedFile.type.startsWith("image/")){

image.src=url;
image.style.display="block";

}else if(
selectedFile.type.startsWith("video/")
){

video.src=url;
video.style.display="block";

}

};


/* =========================
   YENİ PAYLAŞIM
========================= */

window.openCreate=()=>{

if(!currentUser){

openLogin();
return;

}

document
.getElementById("createModal")
.classList.add("show");

};


window.createPost=async()=>{

if(!currentUser){

openLogin();
return;

}

const caption=
document
.getElementById("postCaption")
.value.trim();

const msg=
document
.getElementById("postMessage");

if(!caption&&!selectedFile){

msg.innerText=
"Fotoğraf, video veya açıklama ekle.";

return;

}

msg.innerText=
"Paylaşım hazırlanıyor...";

try{

let mediaURL="";

let mediaType="text";

if(selectedFile){

if(
!selectedFile.type.startsWith("image/") &&
!selectedFile.type.startsWith("video/")
){

msg.innerText=
"Geçersiz dosya.";

return;

}

if(
selectedFile.type.startsWith("video/") &&
selectedFile.size>50*1024*1024
){

msg.innerText=
"Video 50 MB'dan küçük olmalı.";

return;

}

mediaType=
selectedFile.type.startsWith("video/")
?"video"
:"image";

mediaURL=
await uploadFile(
selectedFile,
"paylasimlar/"+currentUser.uid
);

}

await addDoc(
POSTS,
{
kullaniciId:currentUser.uid,
ePosta:currentUser.email,
isim:currentUser.email.split("@")[0],
altyazi:caption,
resim:mediaURL,
mediaType:mediaType,
begeni:0,
olusturulmaTarihi:serverTimestamp()
}
);

msg.innerText=
"✅ Paylaşım yayınlandı!";

document
.getElementById("postCaption")
.value="";

document
.getElementById("postFile")
.value="";

document
.getElementById("postImagePreview")
.style.display="none";

document
.getElementById("postVideoPreview")
.style.display="none";

document
.getElementById("uploadProgress")
.style.display="none";

selectedFile=null;

await loadPosts();

setTimeout(
()=>{
closeModal("createModal");
},
700
);

}catch(error){

console.error(error);

msg.innerText=
"❌ Paylaşım hatası: "+
error.message;

}

};


/* =========================
   PAYLAŞIMLARI GETİR
========================= */

async function loadPosts(){

const feed=
document.getElementById("feed");

const status=
document.getElementById("status");

status.innerText=
"Paylaşımlar yükleniyor...";

try{

const q=
query(
POSTS,
orderBy(
"olusturulmaTarihi",
"desc"
)
);

const snapshot=
await getDocs(q);

postsCache=[];

feed.innerHTML="";

if(snapshot.empty){

feed.innerHTML=
"<div class='empty'>Henüz paylaşım yok.<br><br>İlk paylaşımı sen yap 🚀</div>";

status.innerText=
"Clipo hazır.";

return;

}

snapshot.forEach(
snap=>{

const data=snap.data();

data.id=snap.id;

postsCache.push(data);

renderPost(data);

}
);

status.innerText=
"Clipo hazır.";

}catch(error){

console.error(error);

status.innerText=
"Clipo hazır.";

feed.innerHTML=
"<div class='error'>Paylaşımlar yüklenemedi.<br><br>"+
error.message+
"</div>";

}

}


/* =========================
   PAYLAŞIMI GÖSTER
========================= */

function renderPost(data){

const feed=
document.getElementById("feed");

const post=
document.createElement("div");

post.className="post";

let media=
"<div class='media'><div class='placeholder'>🎬</div></div>";

if(data.resim){

if(data.mediaType==="video"){

media=
"<div class='media'>"+
"<video src='"+data.resim+"' controls playsinline></video>"+
"</div>";

}else{

media=
"<div class='media'>"+
"<img src='"+data.resim+"' alt='Clipo paylaşımı'>"+
"</div>";

}

}

post.innerHTML=

"<div class='post-header'>"+
"<div class='avatar'>😎</div>"+
"<div><b>@"+
escapeHtml(data.isim||"clipo")+
"</b><br><small>Clipo</small></div>"+
"</div>"+

media+

"<div class='actions'>"+

"<span class='action like' onclick='likePost(this,\""+
data.id+
"\")'>❤️</span>"+

"<span class='action' onclick='openComments(\""+
data.id+
"\")'>💬</span>"+

"<span class='action' onclick='sharePost(\""+
data.id+
"\")'>↗️</span>"+

"<span class='action' style='margin-left:auto'>🔖</span>"+

"</div>"+

"<div class='likes'>"+
"<span class='like-count'>"+
Number(data.begeni||0)+
"</span> beğeni"+
"</div>"+

"<div class='caption'>"+
"<b>@"+
escapeHtml(data.isim||"clipo")+
"</b> "+
escapeHtml(data.altyazi||"")+
"</div>"+

"<div class='comments' id='comments-"+
data.id+
"'></div>"+

"<div class='comment-form'>"+

"<input id='comment-"+
data.id+
"' placeholder='Yorum yaz...'>"+

"<button onclick='addComment(\""+
data.id+
"\")'>Gönder</button>"+

"</div>";

feed.appendChild(post);

loadComments(data.id);

}


/* =========================
   BEĞENİ
========================= */

window.likePost=async(button,id)=>{

if(!currentUser){

openLogin();
return;

}

const active=
button.classList.toggle("active");

const count=
button
.closest(".post")
.querySelector(".like-count");

let number=
parseInt(count.innerText)||0;

number+=active?1:-1;

if(number<0)number=0;

count.innerText=number;

try{

await updateDoc(
doc(POSTS,id),
{
begeni:
increment(active?1:-1)
}
);

}catch(error){

console.error(error);

button.classList.toggle("active");

number+=active?-1:1;

if(number<0)number=0;

count.innerText=number;

alert(
"Beğeni kaydedilemedi."
);

}

};


/* =========================
   YORUMLAR
========================= */

window.openComments=id=>{

const input=
document.getElementById(
"comment-"+id
);

if(input)input.focus();

};


window.addComment=async id=>{

if(!currentUser){

openLogin();
return;

}

const input=
document.getElementById(
"comment-"+id
);

const text=input.value.trim();

if(!text)return;

try{

await addDoc(
COMMENTS,
{
postId:id,
kullaniciId:currentUser.uid,
isim:currentUser.email.split("@")[0],
metin:text,
tarih:serverTimestamp()
}
);

input.value="";

await loadComments(id);

}catch(error){

console.error(error);

alert(
"Yorum gönderilemedi: "+
error.message
);

}

};


async function loadComments(postId){

const box=
document.getElementById(
"comments-"+postId
);

if(!box)return;

box.innerHTML="";

try{

const snapshot=
await getDocs(COMMENTS);

let count=0;

snapshot.forEach(
snap=>{

const data=snap.data();

if(data.postId===postId){

const div=
document.createElement("div");

div.className="comment";

div.innerHTML=
"<b>@"+
escapeHtml(data.isim||"kullanıcı")+
"</b> "+
escapeHtml(data.metin||"");

box.appendChild(div);

count++;

}

}
);

if(!count){

box.innerHTML=
"<div style='color:#666;font-size:12px'>Henüz yorum yok.</div>";

}

}catch(error){

console.error(error);

}

}


/* =========================
   PAYLAŞ BUTONU
========================= */

window.sharePost=async id=>{

const url=
window.location.origin+
window.location.pathname+
"?post="+id;

try{

await navigator.clipboard.writeText(url);

alert("✅ Clipo paylaşım bağlantısı kopyalandı.");

}catch(error){

prompt(
"Bağlantıyı kopyala:",
url
);

}

};


/* =========================
   SOHBET
========================= */

window.openChat=async()=>{

if(!currentUser){

openLogin();
return;

}

document
.getElementById("chatModal")
.classList.add("show");

await loadMessages();

};


window.sendMessage=async()=>{

if(!currentUser){

openLogin();
return;

}

const input=
document.getElementById(
"chatInput"
);

const text=input.value.trim();

if(!text)return;

const msg=
document.getElementById(
"chatMessage"
);

msg.innerText=
"Gönderiliyor...";

try{

await addDoc(
MESSAGES,
{
kullaniciId:currentUser.uid,
isim:currentUser.email.split("@")[0],
metin:text,
tarih:serverTimestamp()
}
);

input.value="";

msg.innerText="";

await loadMessages();

}catch(error){

console.error(error);

msg.innerText=
"❌ Mesaj gönderilemedi: "+
error.message;

}

};


async function loadMessages(){

const box=
document.getElementById(
"chatMessages"
);

try{

const q=
query(
MESSAGES,
orderBy("tarih","asc")
);

const snapshot=
await getDocs(q);

box.innerHTML="";

snapshot.forEach(
snap=>{

const data=snap.data();

const div=
document.createElement("div");

div.className=
"bubble"+
(
currentUser &&
data.kullaniciId===currentUser.uid
?" me":""
);

div.innerHTML=
"<b>@"+
escapeHtml(data.isim||"kullanıcı")+
"</b><br>"+
escapeHtml(data.metin||"");

box.appendChild(div);

}
);

box.scrollTop=box.scrollHeight;

}catch(error){

console.error(error);

box.innerHTML=
"<div class='error'>Mesajlar yüklenemedi.</div>";

}

}


/* =========================
   KEŞFET
========================= */

window.openExplore=()=>{

document
.getElementById("exploreModal")
.classList.add("show");

};


window.searchPosts=()=>{

const text=
document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();

const result=
document
.getElementById("searchResults");

if(!text){

result.innerHTML=
"<div class='empty'>Arama yapabilirsin.</div>";

return;

}

const found=
postsCache.filter(
post=>
(post.altyazi||"")
.toLowerCase()
.includes(text)||
(post.isim||"")
.toLowerCase()
.includes(text)
);

if(!found.length){

result.innerHTML=
"<div class='empty'>Sonuç bulunamadı.</div>";

return;

}

result.innerHTML="";

found.forEach(
post=>{

const div=
document.createElement("div");

div.className="notification";

div.innerHTML=
"<b>@"+
escapeHtml(post.isim||"clipo")+
"</b><br>"+
escapeHtml(post.altyazi||"");

result.appendChild(div);

}
);

};


/* =========================
   BİLDİRİMLER
========================= */

window.openNotifications=()=>{

document
.getElementById("notificationModal")
.classList.add("show");

};


/* =========================
   ANA SAYFA
========================= */

window.showHome=()=>{

loadPosts();

};

   ÇIKIŞ
========================= */

window.logoutUser=async()=>{

try{

await signOut(auth);

closeModal("profileModal");

alert("Clipo'dan çıkış yapıldı.");

}catch(error){

alert(
"Çıkış yapılamadı: "+

);

}

/* =========================
   MODAL
========================= */

window.closeModal=id=>{

const modal=
document.getElementById(id);

if(modal)
modal.classList.remove("show");

};


/* =========================
   GÜVENLİ METİN
========================= */

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>
