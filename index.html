<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clipo - Sosyal Video & Sohbet</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#050505;
    color:white;
}

.app{
    max-width:500px;
    min-height:100vh;
    margin:auto;
    background:#0b0b0b;
    padding-bottom:80px;
}

.topbar{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    background:#090909;
    z-index:20;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#ff1744;
}

.icons{
    display:flex;
    gap:18px;
    font-size:22px;
}

.icons span,
.nav,
.add,
.action,
.close,
.story{
    cursor:pointer;
}

.stories{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding:15px;
    border-bottom:1px solid #222;
}

.story{
    min-width:62px;
    text-align:center;
    font-size:11px;
}

.story-img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid #ff1744;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    background:#181818;
    font-size:23px;
    overflow:hidden;
}

.story-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.post{
    background:#111;
    border-bottom:1px solid #252525;
    margin-bottom:20px;
}

.post-header{
    min-height:55px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 14px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex:none;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.media{
    background:#181818;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.media img,
.media video{
    width:100%;
    max-height:600px;
    object-fit:contain;
    display:block;
}

.actions{
    display:flex;
    gap:20px;
    padding:12px 15px 5px;
    font-size:25px;
}

.like.active{
    color:#ff1744;
}

.likes{
    padding:5px 15px;
    font-weight:bold;
}

.caption{
    padding:5px 15px 12px;
    color:#ddd;
    line-height:1.4;
}

.comments{
    padding:0 15px 10px;
}

.comment{
    font-size:13px;
    padding:4px 0;
}

.comment-form{
    display:flex;
    gap:7px;
    padding:0 15px 14px;
}

.comment-form input{
    flex:1;
    background:#090909;
    color:white;
    border:1px solid #333;
    border-radius:9px;
    padding:10px;
}

.comment-form button{
    background:#ff1744;
    color:white;
    border:0;
    border-radius:9px;
    padding:0 12px;
}

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:500px;
    height:70px;
    background:#090909;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:30;
}

.nav{
    text-align:center;
    color:#aaa;
    font-size:12px;
}

.nav-icon{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.add{
    width:52px;
    height:42px;
    background:white;
    color:black;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal.show{
    display:flex;
}

.box{
    width:100%;
    max-width:390px;
    max-height:92vh;
    overflow:auto;
    background:#151515;
    border-radius:20px;
    padding:22px;
}

.close{
    text-align:right;
    font-size:27px;
}

.box h2{
    text-align:center;
    margin:8px 0 18px;
}

.input{
    width:100%;
    min-height:48px;
    margin-bottom:11px;
    padding:12px 14px;
    background:#090909;
    color:white;
    border:1px solid #333;
    border-radius:10px;
}

textarea.input{
    height:90px;
    resize:none;
}

.btn{
    width:100%;
    min-height:48px;
    border:0;
    border-radius:10px;
    background:#ff1744;
    color:white;
    font-weight:bold;
    margin-bottom:10px;
}

.btn.secondary{
    background:#333;
}

.message{
    text-align:center;
    color:#aaa;
    font-size:13px;
    margin-top:7px;
}

.profile-avatar{
    width:95px;
    height:95px;
    border-radius:50%;
    background:#333;
    margin:10px auto 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    overflow:hidden;
    border:2px solid #ff1744;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.file-label{
    display:block;
    text-align:center;
    background:#333;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
}

.file-label input{
    display:none;
}

.preview{
    width:100%;
    max-height:250px;
    object-fit:contain;
    border-radius:10px;
    margin-bottom:10px;
    display:none;
}

.search-result,
.chat-user{
    padding:12px;
    border-bottom:1px solid #333;
    cursor:pointer;
}

.chat-messages{
    height:260px;
    overflow:auto;
    background:#090909;
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
}

.bubble{
    padding:8px 11px;
    border-radius:12px;
    background:#292929;
    margin:5px 0;
    max-width:80%;
    font-size:13px;
}

.bubble.me{
    margin-left:auto;
    background:#ff1744;
}

.empty{
    text-align:center;
    color:#777;
    padding:40px 15px;
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="logo">
Cli<span>po</span>
</div>

<div class="icons">
<span onclick="openNotifications()">🔔</span>
<span onclick="openChat()">💬</span>
</div>

</header>


<div class="stories">

<div class="story" onclick="openProfileOrLogin()">
