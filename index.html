<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clipo - Sosyal Video & Sohbet</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
    background:#050505;
    color:white;
}

.app{
    max-width:500px;
    min-height:100vh;
    margin:auto;
    background:#0b0b0b;
}

.topbar{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    background:#090909;
    z-index:10;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.logo span{
    color:#ff1744;
}

.icons{
    display:flex;
    gap:18px;
    font-size:22px;
}

.stories{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding:15px;
    border-bottom:1px solid #222;
}

.story{
    min-width:62px;
    text-align:center;
    font-size:11px;
}

.story-img{
    width:55px;
    height:55px;
    border-radius:50%;
    border:2px solid #ff1744;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    background:#181818;
    font-size:23px;
}

.post{
    background:#111;
    border-bottom:1px solid #252525;
    margin-bottom:20px;
}

.post-header{
    height:55px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 14px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#333;
    display:flex;
    align-items:center;
    justify-content:center;
}

.video{
    height:500px;
    background:linear-gradient(135deg,#241025,#071c2c);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
}

.actions{
    display:flex;
    gap:20px;
    padding:12px 15px 5px;
}

.action{
    font-size:25px;
    cursor:pointer;
}

.like.active{
    color:#ff1744;
}

.likes{
    padding:5px 15px;
    font-weight:bold;
}

.caption{
    padding:5px 15px 15px;
    color:#ddd;
}

.bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:500px;
    height:70px;
    background:#090909;
    border-top:1px solid #292929;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:20;
}

.nav{
    text-align:center;
    color:#aaa;
    font-size:12px;
    cursor:pointer;
}

.nav-icon{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.add{
    width:52px;
    height:42px;
    background:white;
    color:black;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.box{
    width:100%;
    max-width:380px;
    background:#151515;
    border-radius:20px;
    padding:25px;
}

.close{
    text-align:right;
    font-size:26px;
    cursor:pointer;
}

.box h2{
    text-align:center;
    margin:10px 0 20px;
}

.input{
    width:100%;
    height:48px;
    margin-bottom:12px;
    padding:0 14px;
    background:#090909;
    color:white;
    border:1px solid #333;
    border-radius:10px;
}

.btn{
    width:100%;
    height:48px;
    border:0;
    border-radius:10px;
    background:#ff1744;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.btn.secondary{
    background:#333;
}

.message{
    text-align:center;
    margin-top:10px;
    color:#aaa;
    font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
    <div class="logo">Cli<span>po</span></div>

    <div class="icons">
        <span onclick="openLogin()">🔔</span>
        <span onclick="openLogin()">💬</span>
    </div>
</header>

<div class="stories">

    <div class="story">
        <div class="story-img">➕</div>
        Sen
    </div>

    <div class="story">
        <div class="story-img">😎</div>
        Esat
    </div>

    <div class="story">
        <div class="story-img">👩</div>
        Ayşe
    </div>

    <div class="story">
        <div class="story-img">🧔</div>
        Mehmet
    </div>

</div>

<main style="padding-bottom:90px">

<div class="post">

    <div class="post-header">
        <div class="avatar">😎</div>
        <div>
            <b>@clipo</b>
            <br>
            <small>Ankara</small>
        </div>
    </div>

    <div class="video">🎬</div>

    <div class="actions">

        <span class="action like" onclick="likePost(this)">
            ❤️
        </span>

        <span class="action" onclick="openLogin()">
            💬
        </span>

        <span class="action">
            ↗️
        </span>

        <span class="action" style="margin-left:auto">
            🔖
        </span>

    </div>

    <div class="likes">
        <span class="like-count">124</span> beğeni
    </div>

    <div class="caption">
        <b>@clipo</b>
        Clipo'ya hoş geldin! 🎉
        <br>
        Videolarını paylaş, yeni insanlarla tanış.
    </div>

</div>

<div class="post">

    <div class="post-header">
        <div class="avatar">🔥</div>
        <div>
            <b>@ankara</b>
            <br>
            <small>İvedik</small>
        </div>
    </div>

    <div class="video">🔥</div>

    <div class="actions">

        <span class="action like" onclick="likePost(this)">
            ❤️
        </span>

        <span class="action" onclick="openLogin()">
            💬
        </span>

        <span class="action">
            ↗️
        </span>

        <span class="action" style="margin-left:auto">
            🔖
        </span>

    </div>

    <div class="likes">
        <span class="like-count">89</span> beğeni
    </div>

    <div class="caption">
        <b>@ankara</b>
        Ankara'dan selamlar 👋
    </div>

</div>

</main>

<nav class="bottom">

    <div class="nav">
        <span class="nav-icon">🏠</span>
        Ana Sayfa
    </div>

    <div class="nav" onclick="openLogin()">
        <span class="nav-icon">🔎</span>
        Keşfet
    </div>

    <div class="add" onclick="openLogin()">+</div>

    <div class="nav" onclick="openLogin()">
        <span class="nav-icon">💬</span>
        Sohbet
    </div>

    <div class="nav" onclick="openLogin()">
        <span class="nav-icon">👤</span>
        Profil
    </div>

</nav>

</div>

<!-- GİRİŞ / KAYIT -->

<div class="modal" id="loginModal">

<div class="box">

<div class="close" onclick="closeLogin()">×</div>

<h2 id="formTitle">Clipo'ya Giriş Yap</h2>

<input
    class="input"
    id="email"
    type="email"
    placeholder="E-posta"
>

<input
    class="input"
    id="password"
    type="password"
    placeholder="Şifre"
>

<button class="btn" onclick="loginUser()">
    Giriş Yap
</button>

<button class="btn secondary" onclick="registerUser()">
    Kayıt Ol
</button>

<div class="message" id="message"></div>

</div>

</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyDys5NqKqRt2GFcDBUnE1PGXXOC3ap8Asw",

    authDomain: "cripo-e7483.firebaseapp.com",

    projectId: "cripo-e7483",

    storageBucket: "cripo-e7483.firebasestorage.app",

    messagingSenderId: "687926578600",

    appId: "1:687926578600:web:a1bc8b8740d9d153a4e19d",

    measurementId: "G-M4BYQYDYYX"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.loginUser = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if(!email || !password){

        message.innerText =
            "E-posta ve şifre gerekli.";

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.innerText =
            "✅ Clipo'ya giriş yapıldı!";

        setTimeout(closeLogin,1000);

    }catch(error){

        message.innerText =
            "❌ Giriş başarısız: " + error.message;

    }

};


window.registerUser = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    if(!email || !password){

        message.innerText =
            "E-posta ve şifre gerekli.";

        return;
    }


    if(password.length < 6){

        message.innerText =
            "Şifre en az 6 karakter olmalı.";

        return;
    }


    try{

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.innerText =
            "🎉 Clipo hesabın oluşturuldu!";

    }catch(error){

        message.innerText =
            "❌ Kayıt başarısız: " + error.message;

    }

};

</script>


<script>

function openLogin(){

    document
    .getElementById("loginModal")
    .classList.add("show");

}


function closeLogin(){

    document
    .getElementById("loginModal")
    .classList.remove("show");

}


function likePost(button){

    button.classList.toggle("active");

    const post =
        button.closest(".post");

    const count =
        post.querySelector(".like-count");

    let number =
        parseInt(count.innerText);


    if(button.classList.contains("active")){

        number++;

    }else{

        number--;

    }


    count.innerText = number;

}

</script>

</body>
</html>
