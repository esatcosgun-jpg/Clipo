<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clipo - Sosyal Video & Sohbet</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif
}

body{
background:#050505;
color:#fff
}

button,input,textarea{
font:inherit
}

button{
cursor:pointer
}

.app{
width:100%;
max-width:500px;
min-height:100vh;
margin:auto;
background:#0b0b0b;
padding-bottom:85px
}

.topbar{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
background:#090909;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:20
}

.logo{
font-size:30px;
font-weight:bold
}

.logo span{
color:#ff1744
}

.top-actions{
display:flex;
align-items:center;
gap:12px
}

.top-icon{
font-size:22px;
cursor:pointer
}

.login-top{
background:#ff1744;
border:0;
color:white;
padding:9px 13px;
border-radius:20px;
font-weight:bold
}

.stories{
display:flex;
gap:14px;
overflow-x:auto;
padding:15px;
border-bottom:1px solid #222
}

.story{
min-width:62px;
text-align:center;
font-size:11px;
cursor:pointer
}

.story-img{
width:55px;
height:55px;
border-radius:50%;
border:2px solid #ff1744;
display:flex;
align-items:center;
justify-content:center;
margin:auto auto 5px;
background:#181818;
font-size:23px;
overflow:hidden
}

.story-img img{
width:100%;
height:100%;
object-fit:cover
}

.post{
background:#111;
border-bottom:1px solid #252525;
margin-bottom:18px
}

.post-header{
min-height:58px;
display:flex;
align-items:center;
gap:10px;
padding:9px 14px
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
background:#333;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:20px;
flex:none
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.media{
width:100%;
min-height:280px;
max-height:600px;
background:#181818;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.media img{
width:100%;
max-height:600px;
object-fit:contain;
display:block
}

.placeholder{
font-size:75px;
padding:70px
}

.actions{
display:flex;
align-items:center;
gap:20px;
padding:12px 15px 5px
}

.action{
font-size:25px;
cursor:pointer
}

.like.active{
color:#ff1744
}

.likes{
padding:5px 15px;
font-weight:bold
}

.caption{
padding:5px 15px 12px;
color:#ddd;
line-height:1.4
}

.comments{
padding:0 15px 8px
}

.comment{
padding:6px 0;
font-size:13px
}

.comment-form{
display:flex;
gap:7px;
padding:0 15px 14px
}

.comment-form input{
flex:1;
min-width:0;
background:#090909;
color:white;
border:1px solid #333;
border-radius:9px;
padding:10px;
outline:none
}

.comment-form button{
border:0;
border-radius:9px;
background:#ff1744;
