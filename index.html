<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
getDoc,
setDoc,
updateDoc,
increment,
query,
orderBy,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyDys5NqKqRt2GFcDBUnE1PGXXOC3ap8Asw",

authDomain:
"cripo-e7483.firebaseapp.com",

projectId:
"cripo-e7483",

storageBucket:
"cripo-e7483.firebasestorage.app",

messagingSenderId:
"687926578600",

appId:
"1:687926578600:web:a1bc8b8740d9d153a4e19d",

measurementId:
"G-M4BYQYDYYX"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/*
  CLIPO FIRESTORE KOLEKSİYONLARI
*/

const POSTS =
collection(db,"paylasimlar");

const USERS =
collection(db,"kullanicilar");


let currentUser = null;

let profilePhotoData = "";

let postsCache = [];


/* --------------------------------
   SAYFA AÇILIŞI
-------------------------------- */

window.addEventListener("load",function(){

loadPosts();

});


/* --------------------------------
   AUTH
-------------------------------- */

onAuthStateChanged(
auth,
async function(user){

currentUser = user;

const button =
document.getElementById("loginButton");

if(user){

button.innerText = "Profil";

button.onclick =
openProfile;

await loadUserProfile();

}else{

button.innerText = "Giriş Yap";

button.onclick =
openLogin;

}

});



/* --------------------------------
   GİRİŞ
-------------------------------- */

window.openLogin =
function(){

document
.getElementById("loginModal")
.classList.add("show");

};



window.loginUser =
async function(){

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

const message =
document
.getElementById("loginMessage");

if(!email || !password){

message.innerText =
"E-posta ve şifreyi gir.";

return;

}

message.innerText =
"Giriş yapılıyor...";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

message.innerText =
"✅ Giriş başarılı!";

setTimeout(
function(){

closeModal("loginModal");

},
700
);

}catch(error){

console.error(error);

message.innerText =
"❌ Giriş başarısız: " +
translateError(error.code);

}

};



/* --------------------------------
   KAYIT
-------------------------------- */

window.registerUser =
async function(){

const email =
document
.getElementById("loginEmail")
.value
.trim();

const password =
document
.getElementById("loginPassword")
.value;

const message =
document
.getElementById("loginMessage");

if(!email || !password){

message.innerText =
"E-posta ve şifreyi gir.";

return;

}

if(password.length < 6){

message.innerText =
"Şifre en az 6 karakter olmalı.";

return;

}

message.innerText =
"Hesap oluşturuluyor...";

try{

const result =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(
doc(USERS,result.user.uid),
{

ePosta:email,

isim:email.split("@")[0],

resim:"",

olusturulmaTarihi:
serverTimestamp()

}
);

message.innerText =
"🎉 Hesabın oluşturuldu!";

setTimeout(
function(){

closeModal("loginModal");

},
800
);

}catch(error){

console.error(error);

message.innerText =
"❌ Kayıt başarısız: " +
translateError(error.code);

}

};



/* --------------------------------
   HATA ÇEVİRİSİ
-------------------------------- */

function translateError(code){

if(code==="auth/email-already-in-use")
return "Bu e-posta zaten kayıtlı.";

if(code==="auth/invalid-email")
return "E-posta adresi hatalı.";

if(code==="auth/weak-password")
return "Şifre çok zayıf.";

if(code==="auth/invalid-credential")
return "E-posta veya şifre yanlış.";

if(code==="auth/user-not-found")
return "Bu hesap bulunamadı.";

if(code==="auth/wrong-password")
return "Şifre yanlış.";

if(code==="auth/too-many-requests")
return "Çok fazla deneme yapıldı. Biraz bekle.";

return "Firebase hatası: " + code;

}



/* --------------------------------
   PROFİL
-------------------------------- */

window.openProfileOrLogin =
function(){

if(currentUser){

openProfile();

}else{

openLogin();

}

};



window.openProfile =
async function(){

if(!currentUser){

openLogin();

return;

}

await loadUserProfile();

document
.getElementById("profileModal")
.classList.add("show");

};



async function loadUserProfile(){

if(!currentUser)
return;

try{

const snap =
await getDoc(
doc(USERS,currentUser.uid)
);

document
.getElementById("profileEmail")
.innerText =
currentUser.email || "";

if(snap.exists()){

const data =
snap.data();

document
.getElementById("profileName")
.innerText =
data.isim ||
currentUser.email.split("@")[0];

if(data.resim){

document
.getElementById("profileAvatar")
.innerHTML =
"<img src='"+data.resim+"'>";

profilePhotoData =
data.resim;

}

}

}catch(error){

console.error(error);

}

}



/* --------------------------------
   PROFİL FOTOĞRAFI
-------------------------------- */

window.changeProfilePhoto =
function(event){

const file =
event.target.files[0];

if(!file)
return;

compressImage(
file,
function(data){

profilePhotoData =
data;

document
.getElementById("profileAvatar")
.innerHTML =
"<img src='"+data+"'>";

}
);

};



window.saveProfile =
async function(){

if(!currentUser){

openLogin();

return;

}

const message =
document
.getElementById("profileMessage");

const name =
document
.getElementById("profileName")
.innerText;

message.innerText =
"Kaydediliyor...";

try{

await setDoc(
doc(USERS,currentUser.uid),
{

ePosta:currentUser.email,

isim:name,

resim:profilePhotoData,

guncelleme:
serverTimestamp()

},
{merge:true}
);

message.innerText =
"✅ Profil kaydedildi.";

}catch(error){

console.error(error);

message.innerText =
"❌ Profil kaydedilemedi: " +
error.code;

}

};



/* --------------------------------
   RESİM SIKIŞTIRMA
-------------------------------- */

function compressImage(
file,
callback
){

const reader =
new FileReader();

reader.onload =
function(){

const img =
new Image();

img.onload =
function(){

const canvas =
document.createElement("canvas");

const max =
900;

let width =
img.width;

let height =
img.height;

if(width > max){

height =
height * max / width;

width =
max;

}

if(height > max){

width =
width * max / height;

height =
max;

}

canvas.width =
width;

canvas.height =
height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0,
width,
height
);

const data =
canvas.toDataURL(
"image/jpeg",
0.65
);

callback(data);

};

img.src =
reader.result;

};

reader.readAsDataURL(file);

}



/* --------------------------------
   PAYLAŞIM RESİM ÖNİZLEME
-------------------------------- */

window.previewPostImage =
function(event){

const file =
event.target.files[0];

if(!file)
return;

compressImage(
file,
function(data){

const preview =
document
.getElementById("postPreview");

preview.src =
data;

preview.style.display =
"block";

preview.dataset.image =
data;

}
);

};



/* --------------------------------
   YENİ PAYLAŞIM
-------------------------------- */

window.openCreate =
function(){

if(!currentUser){

openLogin();

return;

}

document
.getElementById("createModal")
.classList.add("show");

};



window.createPost =
async function(){

if(!currentUser){

openLogin();

return;

}

const caption =
document
.getElementById("postCaption")
.value
.trim();

const preview =
document
.getElementById("postPreview");

const image =
preview.dataset.image || "";

const message =
document
.getElementById("postMessage");

if(!caption && !image){

message.innerText =
"Fotoğraf veya açıklama ekle.";

return;

}

message.innerText =
"Paylaşım yükleniyor...";

try{

await addDoc(
POSTS,
{

ePosta:
currentUser.email,

kullaniciId:
currentUser.uid,

isim:
currentUser.email.split("@")[0],

altyazi:
caption,

resim:
image,

begeni:
0,

olusturulmaTarihi:
serverTimestamp()

}
);

message.innerText =
"✅ Paylaşım yayınlandı!";

document
.getElementById("postCaption")
.value="";

preview.src="";

preview.dataset.image="";

preview.style.display="none";

setTimeout(
function(){

closeModal("createModal");

loadPosts();

},
700
);

}catch(error){

console.error(error);

message.innerText =
"❌ Paylaşım yapılamadı: " +
error.code;

}

};



/* --------------------------------
   PAYLAŞIMLARI GETİR
-------------------------------- */

async function loadPosts(){

const feed =
document.getElementById("feed");

const status =
document.getElementById("status");

try{

status.innerText =
"Paylaşımlar yükleniyor...";

const q =
query(
POSTS,
orderBy(
"olusturulmaTarihi",
"desc"
)
);

const snapshot =
await getDocs(q);

postsCache=[];

feed.innerHTML="";

if(snapshot.empty){

feed.innerHTML =
"<div class='empty'>Henüz paylaşım yok.<br><br>İlk paylaşımı sen yap! 🚀</div>";

status.innerText =
"Clipo hazır.";

return;

}

snapshot.forEach(
function(docSnap){

const data =
docSnap.data();

data.id =
docSnap.id;

postsCache.push(data);

renderPost(
data
);

}
);

status.innerText =
"Clipo hazır.";

}catch(error){

console.error(error);

status.innerText =
"Clipo hazır.";

feed.innerHTML =
"<div class='empty'>Henüz paylaşım görünmüyor.<br><br>Yeni paylaşım yapmak için + butonuna bas.</div>";

}

}

-------------------------------- */

function renderPost(data){

const feed =
document.getElementById("feed");

const post =
document.createElement("div");

post.className =
"post";

let media =
"<div class='media'><div class='placeholder'>🎬</div></div>";

if(data.resim){

media =
"<div class='media'>" +
"<img src='"+data.resim+"' alt='Clipo paylaşımı'>" +
"</div>";

}

const likes =
Number(data.begeni || 0);

post.innerHTML =

"<div class='post-header'>" +

"<div class='avatar'>😎</div>" +

"<div>" +

"<b>@"+
escapeHtml(data.isim || "clipo")+
"</b><br>" +

"<small>Clipo</small>" +

"</div>" +

"</div>" +

media +

"<div class='actions'>" +

"<span class='action like' onclick='likePost(this,\""+
data.id+
"\")'>❤️</span>" +

"<span class='action' onclick='openComments(\""+
data.id+
"\")'>💬</span>" +

"<span class='action' onclick='sharePost()'>↗️</span>" +

"<span class='action' style='margin-left:auto'>🔖</span>" +

"</div>" +

"<div class='likes'>" +

"<span class='like-count'>"+
likes+
"</span> beğeni" +

"</div>" +

"<div class='caption'>" +

"<b>@"+
escapeHtml(data.isim || "clipo")+
"</b> " +

escapeHtml(data.altyazi || "") +

"</div>" +

"<div class='comments' id='comments-"+data.id+"'>" +

"</div>" +

"<div class='comment-form'>" +

"<input id='comment-"+data.id+"' placeholder='Yorum yaz...'>" +

"<button onclick='addComment(\""+
data.id+
"\")'>Gönder</button>" +

"</div>";

feed.appendChild(post);

}

-------------------------------- */

window.likePost =
async function(button,id){

if(!currentUser){

openLogin();

return;

}

button.classList.toggle("active");

try{

await updateDoc(
doc(POSTS,id),
{

begeni:
increment(
button.classList.contains("active")
?1:-1
)

}
);

const count =
button
.closest(".post")
.querySelector(".like-count");

let n =
parseInt(count.innerText);

n +=
button.classList.contains("active")
?1:-1;

if(n<0)n=0;

count.innerText=n;

}catch(error){

console.error(error);

}

};

-------------------------------- */

window.openExplore =
function(){

document
.getElementById("exploreModal")
.classList.add("show");

};



window.searchPosts =
function(){

const text =
document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();

const result =
document
.getElementById("searchResults");

if(!text){

result.innerHTML =
"<div class='empty'>Arama yapabilirsin.</div>";

return;

}

const found =
postsCache.filter(
function(post){

return (
(post.altyazi || "")
.toLowerCase()
.includes(text)
||
(post.isim || "")
.toLowerCase()
.includes(text)
);

}
);

if(!found.length){

result.innerHTML =
"<div class='empty'>Sonuç bulunamadı.</div>";

return;

}

result.innerHTML="";

found.forEach(
function(post){

const div =
document.createElement("div");

div.className =
"notification";

div.innerHTML =
"<b>@"+
escapeHtml(post.isim || "clipo")+
"</b><br>"+
escapeHtml(post.altyazi || "");

result.appendChild(div);

}
);

};

/* --------------------------------
   GÜVENLİ METİN
-------------------------------- */

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}
