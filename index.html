<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Clipo - Sosyal Video</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
}

button,input,textarea{
font:inherit;
}

.app{
max-width:500px;
min-height:100vh;
margin:auto;
background:#0b0b0b;
padding-bottom:85px;
}

.topbar{
height:65px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
background:#090909;
border-bottom:1px solid #222;
position:sticky;
top:0;
z-index:20;
}

.logo{
font-size:30px;

}

.logo span{
color:#ff1744;
}

.top-right{
display:flex;
align-items:center;
gap:10px;
}

.top-icon{
font-size:22px;
cursor:pointer;
padding:5px;
}

.login-btn{
background:#ff1744;
color:white;
border:0;
border-radius:20px;
padding:9px 13px;
font-weight:bold;
cursor:pointer;
}

.stories{
display:flex;
gap:14px;
overflow-x:auto;
padding:15px;
border-bottom:1px solid #222;
}

.story{
min-width:62px;
text-align:center;
font-size:11px;
cursor:pointer;
}

.story-img{
width:55px;
height:55px;
border-radius:50%;

display:flex;
align-items:center;
justify-content:center;
margin:auto auto 5px;
overflow:hidden;
font-size:22px;
}

.story-img img{
width:100%;
height:100%;
object-fit:cover;
}

.post{
background:#111;
border-bottom:1px solid #252525;
margin-bottom:18px;
}

.post-header{

display:flex;
align-items:center;
gap:10px;
padding:9px 14px;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:#333;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
flex:none;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.media{
width:100%;
min-height:300px;
background:#181818;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.media img,
.media video{
width:100%;
max-height:600px;
object-fit:contain;
display:block;
}

.text-post{
padding:35px 20px;
font-size:18px;
line-height:1.5;
}

.actions{
display:flex;
align-items:center;
gap:20px;
padding:12px 15px 5px;
}

.action{
font-size:25px;
cursor:pointer;
user-select:none;
}

.like.active{
color:#ff1744;
}

.likes{
padding:5px 15px;
font-weight:bold;
}

.caption{
padding:5px 15px 10px;
color:#ddd;
line-height:1.5;
}

.comments{
padding:0 15px 8px;
}

.comment{
padding:5px 0;

}

.comment-form{
display:flex;
gap:7px;
padding:0 15px 14px;
}

.comment-form input{

padding:10px;
outline:none;
}

background:#ff1744;
color:white;
border:0;
border-radius:9px;
padding:0 13px;
font-weight:bold;
cursor:pointer;
}

transform:translateX(-50%);

height:70px;

display:flex;
justify-content:space-around;
align-items:center;
z-index:30;
}

.nav{
text-align:center;
color:#aaa;
font-size:12px;
cursor:pointer;
}

.nav-icon{
display:block;
font-size:23px;
margin-bottom:3px;
}

.add{
width:52px;
height:42px;
border-radius:12px;
background:white;
color:black;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
cursor:pointer;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.94);
z-index:100;
align-items:center;
justify-content:center;
padding:18px;
}

.modal.show{
display:flex;
}

.box{
width:100%;
max-width:400px;
max-height:92vh;
overflow:auto;
background:#151515;
border-radius:20px;
padding:22px;
}

.close{
text-align:right;
font-size:28px;
cursor:pointer;
}

.box h2{
text-align:center;
margin:8px 0 20px;
}

.input{
width:100%;
height:48px;
margin-bottom:12px;
padding:0 14px;
background:#090909;
color:white;
border:1px solid #333;
border-radius:10px;
outline:none;
}

textarea.input{
height:100px;
padding:12px;
resize:none;
}

.btn{
width:100%;
min-height:48px;
border:0;
border-radius:10px;
background:#ff1744;
color:white;
font-weight:bold;
margin-bottom:10px;
cursor:pointer;
}

.btn.secondary{
background:#333;
}

.message{
text-align:center;
color:#aaa;
font-size:13px;
line-height:1.5;
margin-top:8px;
}

.profile-avatar{
width:105px;
height:105px;
border-radius:50%;
background:#333;
border:2px solid #ff1744;
margin:10px auto 15px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:42px;
}

.profile-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.profile-email{
text-align:center;
color:#aaa;
word-break:break-all;
margin-bottom:18px;
}
